services:
  postgres:
    image: postgres:15
    container_name: lego_postgres
    environment:
      POSTGRES_DB: lego_classifier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5433}:5432"   # порт берётся из .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
